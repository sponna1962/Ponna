name: One-off Ask Ponna syllabus fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch syllabus PDF source selection
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('backend/src/modules/ask-ponna/tool-layer.ts')
          text = path.read_text(encoding='utf-8')

          old = """      const syllabusFact = await prisma.verifiedExamFact.findFirst({
        where: { subCategoryId, factType: 'ELIGIBILITY', sourceUrl: { not: null } },
        orderBy: { verifiedAt: 'desc' },
        select: { sourceUrl: true },
      });
"""

          new = """      // Prefer the PONNA-hosted syllabus PDF (typically Cloudinary) over an
      // external TNPSC source URL when both are present. The syllabus import
      // stores the uploaded PDF URL on the ELIGIBILITY fact, but an older or
      // separately imported ELIGIBILITY fact can still point at tnpsc.gov.in.
      // Ask Ponna must download the PDF that is actually hosted by PONNA.
      const syllabusFacts = await prisma.verifiedExamFact.findMany({
        where: { subCategoryId, factType: 'ELIGIBILITY', sourceUrl: { not: null } },
        orderBy: { verifiedAt: 'desc' },
        select: { sourceUrl: true },
      });
      const ponnaPdf = syllabusFacts.find((f) =>
        f.sourceUrl?.includes('res.cloudinary.com')
      )?.sourceUrl ?? null;
      const syllabusPdf = ponnaPdf ?? syllabusFacts[0]?.sourceUrl ?? null;
"""

          if old not in text:
              raise SystemExit('Expected syllabus PDF selection block not found; aborting without changes.')

          text = text.replace(old, new, 1)
          text = text.replace("pdfUrl: syllabusFact?.sourceUrl ?? null,", "pdfUrl: syllabusPdf,")
          path.write_text(text, encoding='utf-8')

      - name: Verify patch
        run: |
          grep -n "Prefer the PONNA-hosted syllabus PDF" backend/src/modules/ask-ponna/tool-layer.ts
          grep -n "pdfUrl: syllabusPdf" backend/src/modules/ask-ponna/tool-layer.ts

      - name: Commit patch and remove one-off workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/modules/ask-ponna/tool-layer.ts
          git rm .github/workflows/one-off-fix-ask-ponna-syllabus.yml
          git commit -m "fix: prefer PONNA-hosted syllabus PDF in Ask Ponna"
          git push
